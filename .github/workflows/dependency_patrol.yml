name: Autonomous Dependency & CVE Patrol

on:
  schedule:
    - cron: '0 3 * * 1' # Run every Monday at 3:00 AM UTC
  workflow_dispatch:
    inputs:
      target:
        description: 'Target Repository (owner/repo or "all")'
        required: true
        default: 'all'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  supply-chain-patrol:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Dependency Warden
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Fleet Dependency & CVE Audit
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TARWATER_KILL_SWITCH: "false"
        run: |
          python upgrade_dispatcher.py --target "${{ github.event.inputs.target || 'all' }}"
